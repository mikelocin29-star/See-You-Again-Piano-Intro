<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Piano with Sheet Music</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <style>
    body {
      background-color: #222;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    h1 {
      margin-bottom: 5px;
    }

    p {
      color: #aaa;
      margin-bottom: 20px;
      text-align: center;
      max-width: 600px;
    }

    /* Style for your notation image */
    .sheet-music {
      max-width: 400px;
      width: 100%;
      height: auto;
      margin-bottom: 25px;
      border-radius: 8px;
      background: #fff;
      padding: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }

    #piano {
      display: flex;
      position: relative;
      background: #000;
      padding: 10px;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .key {
      box-sizing: border-box;
      position: relative;
      cursor: pointer;
      user-select: none;
      border-radius: 0 0 5px 5px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 12px;
      font-weight: bold;
      font-size: 12px;
      transition: background 0.1s;
    }

    .white {
      width: 40px;
      height: 180px;
      background: #fff;
      color: #333;
      border: 1px solid #ccc;
      z-index: 1;
    }

    .white.active, .white:active {
      background: #d4d4d4;
    }

    .black {
      width: 24px;
      height: 110px;
      background: #333;
      color: #fff;
      position: absolute;
      z-index: 2;
      border-radius: 0 0 4px 4px;
      border: 1px solid #111;
      cursor: default;
    }
  </style>
</head>
<body>

  <h1>See You Again - Piano Intro</h1>
  <p>Use your computer keyboard numbers (1 to 0) to play along with the grid notation below!</p>

  <!-- INSERT YOUR IMAGE HERE -->
  <img src="notation.png" alt="Piano Grid Notation" class="sheet-music">

  <div id="piano">
    <!-- White Keys (Active with sounds and numbered labels) -->
    <div class="key white" data-note="C4" data-key="1">1</div>
    <div class="key white" data-note="D4" data-key="2">2</div>
    <div class="key white" data-note="E4" data-key="3">3</div>
    <div class="key white" data-note="F4" data-key="4">4</div>
    <div class="key white" data-note="G4" data-key="5">5</div>
    <div class="key white" data-note="A4" data-key="6">6</div>
    <div class="key white" data-note="B4" data-key="7">7</div>
    <div class="key white" data-note="C5" data-key="8">8</div>
    <div class="key white" data-note="D5" data-key="9">9</div>
    <div class="key white" data-note="E5" data-key="0">0</div>

    <!-- Black Keys (Visual Only / Unlabelled) -->
    <div class="key black" style="left: 37px;"></div>
    <div class="key black" style="left: 77px;"></div>
    
    <div class="key black" style="left: 157px;"></div>
    <div class="key black" style="left: 197px;"></div>
    <div class="key black" style="left: 237px;"></div>
    
    <div class="key black" style="left: 317px;"></div>
    <div class="key black" style="left: 357px;"></div>
  </div>

  <script>
    const pianoSampler = new Tone.Sampler({
      urls: {
        "C4": "C4.mp3",
        "D#4": "Ds4.mp3",
        "F#4": "Fs4.mp3",
        "A4": "A4.mp3",
      },
      baseUrl: "https://tonejs.github.io/audio/salamander/",
      onload: () => {
        console.log("Piano samples loaded successfully!");
      }
    }).toDestination();

    async function playNote(note, element) {
      if (Tone.context.state !== 'running') {
        await Tone.start();
      }
      
      pianoSampler.triggerAttackRelease(note, "8n");

      if (element) {
        element.classList.add('active');
        setTimeout(() => element.classList.remove('active'), 150);
      }
    }

    const keys = document.querySelectorAll('.key[data-note]');
    keys.forEach(key => {
      const note = key.dataset.note;
      key.addEventListener('mousedown', () => playNote(note, key));
    });

    window.addEventListener('keydown', (e) => {
      if (e.repeat) return; 

      const targetKey = e.key.toLowerCase();
      const keyElement = document.querySelector(`.key[data-key="${targetKey}"]`);

      if (keyElement) {
        const note = keyElement.dataset.note;
        playNote(note, keyElement);
      }
    });
  </script>

</body>
</html>
